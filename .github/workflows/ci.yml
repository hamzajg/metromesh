name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The solution file needs a 9.0+ SDK; the projects target net8.0.
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MetroMesh.slnx

      # Integration suites start PostgreSQL and Redpanda through Testcontainers,
      # using the Docker daemon available on the runner.
      - name: Test
        run: dotnet test MetroMesh.slnx --no-restore --nologo --logger "console;verbosity=normal"
